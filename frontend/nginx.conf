server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Default de nginx es 1m, insuficiente para subir facturas: el backend
    # acepta hasta 10 imágenes de 5MB cada una (ver MaxFileSizeValidator en
    # registro-gastos.controller.ts), y el overhead de multipart/form-data
    # puede hacer que incluso una sola imagen <1MB supere el límite default.
    client_max_body_size 60m;

    gzip on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 95s: 5s de margen sobre el timeout real del backend (90s, ver
        # `timeoutMs` en backend/src/main.ts — usado para el fallback LLM de
        # facturas sin QR). Si cambias uno, cambia el otro.
        proxy_connect_timeout 95s;
        proxy_send_timeout 95s;
        proxy_read_timeout 95s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico {
        try_files $uri =404;
    }
}