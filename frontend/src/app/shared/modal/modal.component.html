@if (visible) {
  <div class="modal-backdrop" (click)="onBackdropClick()">
    <div class="modal-panel modal-panel--{{ size }}" role="dialog" aria-modal="true" [attr.aria-labelledby]="titleId"
         (click)="$event.stopPropagation()">
      <header class="modal-header">
        <div class="modal-icon" [attr.data-variant]="variant">
          <ng-content select="[modal-icon]">
            <app-icon [name]="icon" />
          </ng-content>
        </div>
        <div class="modal-header-text">
          <h2 class="modal-title" [id]="titleId">{{ title }}</h2>
          @if (subtitle) { <p class="modal-subtitle">{{ subtitle }}</p> }
        </div>
        <button type="button" class="modal-close" (click)="close()" aria-label="Cerrar">
          <app-icon name="close-linear" />
        </button>
      </header>

      <div class="modal-body">
        <ng-content select="[modal-body]"></ng-content>
      </div>

      <footer class="modal-footer">
        <ng-content select="[modal-footer]"></ng-content>
      </footer>
    </div>
  </div>
}
