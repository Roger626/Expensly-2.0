<div class="form-control">
  <label [for]="inputId">{{ label }}</label>
  <div class="input-shell" [class.input-shell--password]="type === 'password'">
    <input
      [id]="inputId"
      [type]="inputType"
      (input)="onInput($event)"
      [placeholder]="placeholder"
      (blur)="onTouched()"
      [disabled]="disable"
      [value]="value"
      [class.is-invalid]="isInvalid"
      [attr.aria-invalid]="isInvalid || null"
      [attr.aria-describedby]="isInvalid ? inputId + '-err' : null"
      [attr.step]="type === 'number' ? '0.01' : null"
    />
    @if (type === 'password' && showPasswordToggle) {
      <button type="button" class="password-toggle" (click)="togglePasswordVisibility()"
              [attr.aria-label]="passwordVisible ? 'Ocultar contraseña' : 'Mostrar contraseña'" [attr.aria-pressed]="passwordVisible">
        <app-icon [name]="passwordVisible ? 'eye-linear' : 'eye-closed-linear'" />
      </button>
    }
  </div>
  <span *ngIf="isInvalid" class="error-msg" [id]="inputId + '-err'">Revisa este campo: es obligatorio o tiene un formato inválido.</span>
</div>
