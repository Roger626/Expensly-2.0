<div class="toast-container" aria-live="polite">
  @for (toast of toasts$ | async; track toast.id) {
    <div class="toast" [attr.data-type]="toast.type" [attr.role]="toast.type === 'error' ? 'alert' : 'status'">
      <app-icon [name]="icon[toast.type]" class="toast-icon" />
      <div class="toast-body">
        <span class="toast-title">{{ toast.title }}</span>
        @if (toast.message) { <span class="toast-message">{{ toast.message }}</span> }
      </div>
      <button type="button" class="toast-dismiss" (click)="dismiss(toast.id)" aria-label="Cerrar aviso">
        <app-icon name="close-linear" />
      </button>
      <span class="toast-progress" [style.animation-duration.ms]="toast.durationMs"></span>
    </div>
  }
</div>
