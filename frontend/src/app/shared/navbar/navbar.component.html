<nav class="bar" aria-label="Navegación principal">
  <a routerLink="/" class="brand"><span class="brand-mark">E</span> Expensly</a>

  @if (minimal) {
    <a routerLink="/" class="ui-btn ui-btn--ghost ui-btn--sm"><app-icon name="home-2-linear" /> Inicio</a>
  } @else {
    <ul class="links">
      <li>
        <a routerLink="/facturas" routerLinkActive="on" #a1="routerLinkActive" [routerLinkActiveOptions]="{ exact: true }">
          <app-icon [name]="a1.isActive ? 'bill-list-bold-duotone' : 'bill-list-linear'" /> Mis facturas
        </a>
      </li>
      <li>
        <a routerLink="/facturas/crear" routerLinkActive="on" #a2="routerLinkActive">
          <app-icon [name]="a2.isActive ? 'document-add-bold-duotone' : 'document-add-linear'" /> Subir factura
        </a>
      </li>
    </ul>

    <div class="user">
      @if (userName) {
        <span class="ui-avatar">{{ initials }}</span>
        <span class="user-name">{{ userName }}</span>
      }
      <button type="button" class="ui-btn ui-btn--ghost ui-btn--sm" (click)="onLogout()" aria-label="Cerrar sesión">
        <app-icon name="logout-2-linear" /> <span class="out">Salir</span>
      </button>
    </div>
  }
</nav>
