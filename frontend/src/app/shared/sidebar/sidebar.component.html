<nav class="sidebar_layout" [class.is-collapsed]="isCollapsed" aria-label="Navegación principal">

  <div class="nav-logo">
    <div class="logo-group">
      <div class="logo-icon">E</div>
      @if (!isCollapsed) { <span class="logo-text">Expensly</span> }
    </div>
  </div>

  <button class="toggle-btn" type="button" (click)="toggleSidebar()"
          [attr.aria-label]="isCollapsed ? 'Expandir menú' : 'Contraer menú'" [attr.aria-expanded]="!isCollapsed">
    <app-icon [name]="isCollapsed ? 'alt-arrow-right-linear' : 'alt-arrow-left-linear'" class="toggle-icon" />
  </button>

  <ul class="nav-links">
    @for (item of items(); track item.link) {
      <li>
        <a [routerLink]="item.link" routerLinkActive="clase-activa" #rla="routerLinkActive"
           [routerLinkActiveOptions]="{ exact: !!item.exact }" [attr.title]="isCollapsed ? item.label : null"
           [attr.aria-label]="isCollapsed ? item.label : null">
          <app-icon [name]="rla.isActive ? item.activeIcon : item.icon" class="icon" />
          @if (!isCollapsed) { <span class="text">{{ item.label }}</span> }
        </a>
      </li>
    }
  </ul>

  <div class="user-logout">
    <button type="button" (click)="onLogout()" [attr.title]="isCollapsed ? 'Cerrar sesión' : null" [attr.aria-label]="isCollapsed ? 'Cerrar sesión' : null">
      <app-icon name="logout-2-linear" class="icon" />
      @if (!isCollapsed) { <span class="text">Cerrar Sesión</span> }
    </button>
  </div>
</nav>
