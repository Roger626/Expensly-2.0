<app-user-action-modal [visible]="actionModalVisible" [mode]="actionModalMode" [usuario]="actionModalUsuario"
  (cerrar)="actionModalVisible = false" (rolCambiado)="onRolCambiado($event)" (eliminado)="onEliminado($event)" />

<app-user-invite-modal [visible]="modalVisible" [isLoading]="(isInviting$ | async) ?? false" [success]="(inviteSuccess$ | async) ?? false"
  (cerrar)="cerrarModal()" (invitar)="onInvitar($event)" />

<app-suscripcion-banner />

<header class="ui-page-head">
  <div>
    <h1>Usuarios</h1>
    <p>Las personas de tu organización y lo que cada una puede hacer.</p>
  </div>
  <div class="ui-page-actions">
    <button type="button" class="ui-btn ui-btn--primary" (click)="abrirModal()">
      <app-icon name="user-plus-linear" /> Invitar usuario
    </button>
  </div>
</header>

<div class="layout">
  <section class="ui-panel">
    <div class="toolbar">
      <label class="ui-search">
        <app-icon name="magnifer-linear" />
        <input class="ui-input" type="search" placeholder="Buscar por nombre o correo" aria-label="Buscar usuarios"
               [ngModel]="busqueda()" (ngModelChange)="onBuscar($event)">
      </label>
      <div class="ui-seg" role="group" aria-label="Filtrar por rol">
        @for (r of roles; track r) {
          <button type="button" [attr.aria-pressed]="rol() === r" (click)="onRol(r)">
            {{ r === 'Admin' ? 'Admins' : r === 'Contador' ? 'Contadores' : r === 'Empleado' ? 'Empleados' : 'Todos' }}
            <span class="seg-count num">{{ conteo()[r] }}</span>
          </button>
        }
      </div>
    </div>

    @if (error$ | async; as err) {
      <div class="ui-alert state" role="alert"><app-icon name="danger-triangle-linear" /> {{ err }}</div>
    }

    @if ((isLoading$ | async) && !usuarios().length) {
      <div class="loading">@for (i of [1, 2, 3, 4]; track i) { <div class="ui-skeleton row-skel"></div> }</div>
    } @else {
      <app-user-table
        [usuarios]="paginados()"
        [totalCount]="filtrados().length"
        [paginaActual]="pagina()"
        [itemsPorPagina]="pageSize"
        [currentUserId]="currentUserId()"
        [hasFilter]="!!busqueda() || rol() !== 'Todos'"
        (pageChange)="pagina.set($event)"
        (menuAccion)="onMenuAccion($event)"
        (invitar)="abrirModal()" />
    }
  </section>

  <app-user-role-guide />
</div>
