<div class="filter-bar">
  <label class="ui-search search">
    <app-icon name="magnifer-linear" />
    <input class="ui-input" type="search" [(ngModel)]="searchTerm" (input)="onSearchInput()"
           placeholder="Proveedor, RUC, CUFE, número o empleado" aria-label="Buscar facturas">
  </label>

  <div class="dates" role="group" aria-label="Fecha de emisión">
    <app-icon name="calendar-linear" class="dates-icon" />
    <input class="ui-input" type="date" [(ngModel)]="dateFrom" (change)="onDateChange()" aria-label="Desde" [max]="dateTo || null">
    <span aria-hidden="true">a</span>
    <input class="ui-input" type="date" [(ngModel)]="dateTo" (change)="onDateChange()" aria-label="Hasta" [min]="dateFrom || null">
  </div>

  <div class="category-dropdown-wrapper">
    <button type="button" class="ui-btn ui-btn--outline trigger" (click)="toggleCategoryDropdown()"
            [attr.aria-expanded]="categoryDropdownOpen" aria-haspopup="true">
      <app-icon name="tag-linear" />
      <span class="trigger-label">{{ categoryLabel }}</span>
      <app-icon name="alt-arrow-down-linear" class="chev" [class.open]="categoryDropdownOpen" />
    </button>

    @if (categoryDropdownOpen) {
      <div class="dropdown" role="group" aria-label="Categorías">
        @for (cat of categories; track cat) {
          <label class="dd-item">
            <input type="checkbox" [checked]="isCategorySelected(cat)" (change)="toggleCategory(cat)">
            <span>{{ cat }}</span>
          </label>
        } @empty {
          <p class="dd-empty">Aún no hay facturas con categoría.</p>
        }
        @if (selectedCategories.size > 0) {
          <button type="button" class="ui-btn ui-btn--ghost ui-btn--sm dd-clear" (click)="clearCategorySelection()">Quitar selección</button>
        }
      </div>
    }
  </div>
</div>
